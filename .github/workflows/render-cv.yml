name: Render & deploy site

# Renders the Quarto site and publishes it to GitHub Pages.
#
# Pages must be configured as: Settings -> Pages -> Source = "GitHub Actions".
# The rendered site (docs/) is NO LONGER committed to the repo — it is built
# here on every push and handed straight to Pages. Publishing a change is
# therefore one step: edit the .qmd, commit, push.
#
# Pull requests build but do not deploy, so a broken render is caught before
# it can reach the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a push
# that lands during a build still gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # .Rprofile sources renv/activate.R, which forces every R session in
      # this repo into renv's local library. In CI we want plain R so
      # install.packages can write to the system library.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Chrome (used by pagedown for HTML -> PDF)
        uses: browser-actions/setup-chrome@v1

      # Only the packages actually used by .qmd / .R chunks here. We skip
      # renv::restore() on purpose: renv.lock carries legacy packages that
      # need extra system libraries and are never used during render.
      - name: Install R packages used by the site
        run: |
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest"))); install.packages(c("rmarkdown","knitr","yaml","scholar","pagedown","chromote","httr")); if (!requireNamespace("rmarkdown", quietly = TRUE)) stop("rmarkdown failed to install")'

      # Rebuilt BEFORE the full render, so `quarto render` copies the fresh
      # PDF into docs/. Non-blocking: if headless Chrome misbehaves on the
      # runner we still deploy, falling back to the committed assets/cv.pdf.
      - name: Rebuild CV PDF
        run: |
          Rscript scripts/build_cv_pdf.R \
            || echo "::warning::CV PDF build failed — deploying the committed assets/cv.pdf instead."

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
