name: Render & deploy site

# Renders the Quarto site and publishes it to GitHub Pages.
#
# Pages must be configured as: Settings -> Pages -> Source = "GitHub Actions".
# The rendered site (docs/) is NO LONGER committed to the repo — it is built
# here on every push and handed straight to Pages. Publishing a change is
# therefore one step: edit the .qmd, commit, push.
#
# Pull requests build but do not deploy, so a broken render is caught before
# it can reach the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a push
# that lands during a build still gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      SITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "TRUE"
    steps:
      - uses: actions/checkout@v7

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.26"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore locked site dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Install Chrome (used by pagedown for HTML -> PDF)
        uses: browser-actions/setup-chrome@v2

      - name: Validate bibliography and run regression checks
        run: |
          Rscript tests/test-audit-fixes.R
          Rscript tests/test-publications.R
          python3 -m unittest discover -s tests -p 'test_*.py'

      # Rebuilt BEFORE the full render, so `quarto render` copies the fresh
      # PDF into docs/. A failed rebuild must stop deployment so the site
      # cannot present an older PDF as the current CV.
      - name: Rebuild CV PDF
        run: Rscript scripts/build_cv_pdf.R

      - name: Render site
        run: quarto render

      - name: Validate generated site and fresh CV PDF
        run: python3 scripts/validate_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
