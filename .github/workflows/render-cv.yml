name: Validate site build

# Validation only — runs on every push and on demand.
# Renders the site and rebuilds the CV PDF in a clean environment so we
# catch broken markdown / missing assets BEFORE GitHub Pages serves a
# broken page. NOTHING is committed back to the repo — you stay in
# charge of docs/, assets/cv.pdf and assets/metrics.yml locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # .Rprofile sources renv/activate.R which forces every R session in
      # this repo to use renv's local library. In CI we want plain R so
      # install.packages can install into the system library — this flag
      # tells the renv bootstrap to skip auto-activation.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Chrome (used by pagedown for HTML → PDF)
        uses: browser-actions/setup-chrome@v1

      # Install only the R packages actually used by .qmd / .R chunks in
      # this repo. We deliberately skip `renv::restore()` because renv.lock
      # carries legacy packages (e.g. igraph) that need extra system
      # libraries on the Ubuntu runner and aren't actually used during
      # render — keeping them was making CI fail.
      - name: Install R packages used by the site
        run: |
          Rscript -e 'install.packages(c("rmarkdown","knitr","yaml","scholar","pagedown","chromote","httr"), repos="https://cloud.r-project.org")'

      - name: Render site (validation)
        run: quarto render

      - name: Build CV PDF (validation)
        run: Rscript scripts/build_cv_pdf.R

      # No commit step — this workflow exists purely to catch render errors.
      # When you change content: edit .qmd → `quarto render` → optionally
      # `Rscript scripts/build_cv_pdf.R` → commit → push. One push, one
      # remote update, no bot in the loop.
