project:
  type: website
  output-dir: docs   # GitHub Pages serves from /docs
  render:
    - "*.qmd"
    - "!_archive_alban_template/"
    - "!README.md"
  resources:
    - talks/
    - CNAME          # ensure GitHub Pages keeps the custom domain after every render

website:
  title: "Biodiversity Synthesis Lab"
  description: "Lab of Diogo B. Provete at UFMS — community ecology, eco-evolutionary dynamics, freshwater metacommunities."
  site-url: "https://provetelab.org/"
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true

  navbar:
    background: light
    pinned: true
    collapse-below: lg
    logo: assets/navbar-logo.png
    logo-alt: "Biodiversity Synthesis Lab logo"
    left:
      - href: index.qmd
        text: Home
      - text: Research
        menu:
          - href: research.qmd
            text: Research lines
          - href: projects.qmd
            text: Projects
          - href: software.qmd
            text: Software
          - text: "Brazilian Tadpoles database"
            href: "https://diogoprov.github.io/Brazilian-Tadpoles-5.0/"
            target: _blank
      - href: publications.qmd
        text: Publications
      - href: people.qmd
        text: People
      - text: Teaching
        menu:
          - href: teaching.qmd
            text: Courses
          - href: talks.qmd
            text: Talks
      - href: news/index.qmd
        text: News
      - href: opportunities.qmd
        text: Join us
    right:
      - icon: github
        href: "https://github.com/diogoprov"
        aria-label: GitHub
      - icon: bluesky
        href: "https://bsky.app/profile/provete.bsky.social"
        aria-label: Bluesky
      - icon: envelope
        href: "mailto:diogo.provete@ufms.br"
        aria-label: Email

  page-footer:
    background: light
    left: |
      © Diogo B. Provete · Biodiversity Synthesis Lab · Instituto de Biociências, UFMS
    right: |
      [<i class="ai ai-orcid"></i>](https://orcid.org/0000-0002-0097-0651){aria-label="ORCID" .footer-icon}
      [<i class="ai ai-google-scholar"></i>](https://scholar.google.com.br/citations?user=qDwcLvIAAAAJ){aria-label="Google Scholar" .footer-icon}
      [<i class="ai ai-lattes"></i>](http://lattes.cnpq.br/9194853434437963){aria-label="Lattes" .footer-icon}
      [<i class="bi bi-bluesky"></i>](https://bsky.app/profile/provete.bsky.social){aria-label="Bluesky" .footer-icon}
      [<i class="bi bi-github"></i>](https://github.com/diogoprov){aria-label="GitHub" .footer-icon}
      · Built with [Quarto](https://quarto.org)

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    code-link: false   # needs downlit+xml2 AND hits CRAN on every render
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet"
                href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
          <style>
            /* Tame Academicons next to text in card rows */
            .ai { vertical-align: -.05em; }
          </style>

editor: source
